<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="30%" stop-color="#FFE082" />
      <stop offset="70%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    
    <!-- Red Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5D4037" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Traditional Shape (Scalloped Badge) -->
  <g filter="url(#shadow)">
    <!-- Base Badge Path with Scalloped Corners -->
    <path d="M 300,20 
             C 380,20 420,40 450,70 
             C 480,100 560,110 560,190 
             C 560,270 480,280 450,310 
             C 420,340 380,360 300,360 
             C 220,360 180,340 150,310 
             C 120,280 40,270 40,190 
             C 40,110 120,100 150,70 
             C 180,40 220,20 300,20 Z" 
          fill="url(#goldGrad)" 
          stroke="#D84315" 
          stroke-width="8" />

    <!-- Inner Border Line -->
    <path d="M 300,32 
             C 372,32 408,50 435,77 
             C 462,104 540,113 540,190 
             C 540,267 462,276 435,303 
             C 408,330 372,348 300,348 
             C 228,348 192,330 165,303 
             C 138,276 60,267 60,190 
             C 60,113 138,104 165,77 
             C 192,50 228,32 300,32 Z" 
          fill="none" 
          stroke="#FFEB3B" 
          stroke-width="3" 
          stroke-dasharray="8 4" />
  </g>

  <!-- Traditional Top Flourish/Ornament -->
  <g transform="translate(300, 105) scale(0.95)" fill="#B71C1C">
    <!-- Center bud -->
    <circle cx="0" cy="-25" r="5" />
    <path d="M 0,-20 C -15,-20 -25,-10 -25,0 C -25,10 -15,15 0,5 C 15,15 25,10 25,0 C 25,-10 15,-20 0,-20 Z M 0,-5 C -8,-5 -12,-8 -12,0 C -12,8 0,10 0,10 C 0,10 12,8 12,0 C 12,-8 8,-5 0,-5 Z" />
    <!-- Left scroll -->
    <path d="M -25,0 C -45,0 -70,-15 -100,-15 C -130,-15 -140,5 -120,15 C -100,25 -70,5 -50,5 C -35,5 -30,0 -25,0 Z" />
    <!-- Right scroll -->
    <path d="M 25,0 C 45,0 70,-15 100,-15 C 130,-15 140,5 120,15 C 100,25 70,5 50,5 C 35,5 30,0 25,0 Z" />
  </g>

  <!-- Brand Name: RAGHUVANSHI -->
  <text x="300" y="190" 
        font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
        font-size="48" 
        font-weight="900" 
        letter-spacing="6" 
        fill="url(#redGrad)" 
        text-anchor="middle" 
        style="text-transform: uppercase;">
    Raghuvanshi
  </text>

  <!-- Subtitle Container: Khaman House & Lassi Centre -->
  <g transform="translate(300, 240)">
    <!-- Red Banner Base -->
    <rect x="-210" y="-30" width="420" height="46" rx="8" fill="url(#redGrad)" />
    <!-- Yellow border for banner -->
    <rect x="-207" y="-27" width="414" height="40" rx="6" fill="none" stroke="#FFEB3B" stroke-width="2" />
    
    <text x="0" y="2" 
          font-family="'Outfit', 'Inter', 'Montserrat', sans-serif" 
          font-size="20" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#FFFFFF" 
          text-anchor="middle">
      KHAMAN HOUSE &amp; LASSI CENTRE
    </text>
  </g>

  <!-- Traditional Bottom Flourish/Ornament -->
  <g transform="translate(300, 275) scale(0.95)" fill="#B71C1C">
    <!-- Left scroll -->
    <path d="M -10,0 C -30,0 -60,10 -80,10 C -100,10 -110,-5 -95,-10 C -80,-15 -60,-5 -40,-5 C -25,-5 -20,0 -10,0 Z" />
    <!-- Right scroll -->
    <path d="M 10,0 C 30,0 60,10 80,10 C 100,10 110,-5 95,-10 C 80,-15 60,-5 40,-5 C 25,-5 20,0 10,0 Z" />
  </g>

  <!-- Slogan: Taste That Feels Like Home -->
  <text x="300" y="325" 
        font-family="'Playfair Display', 'Georgia', serif" 
        font-size="20" 
        font-style="italic" 
        font-weight="700" 
        fill="#5D4037" 
        text-anchor="middle">
    Taste That Feels Like Home
  </text>

  <!-- Pure Veg Badge -->
  <g transform="translate(40, 310)">
    <!-- Square green border -->
    <rect x="0" y="0" width="28" height="28" fill="#FFFFFF" stroke="#388E3C" stroke-width="3" rx="2" />
    <!-- Green circle -->
    <circle cx="14" cy="14" r="7" fill="#388E3C" />
  </g>
</svg>
